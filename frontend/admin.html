<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GreenGuard Admin</title>
    <link rel="stylesheet" href="adminstyle.css">
    <script src="admin.js"></script>
</head>

<body>

    <header>
        <div class="container">
            <h1>GreenGuard Admin Panel</h1>
            <p>Manage and update complaints</p>
        </div>
    </header>

    <section class="dashboard">
        <div class="container">

            <div class="summary">
                <div class="summary-box">
                    <h3>Total Complaints</h3>
                    <p>18</p>
                </div>
                <div class="summary-box">
                    <h3>New</h3>
                    <p>6</p>
                </div>
                <div class="summary-box">
                    <h3>In Progress</h3>
                    <p>7</p>
                </div>
                <div class="summary-box">
                    <h3>Resolved</h3>
                    <p>5</p>
                </div>
            </div>

            <h2>All Complaints</h2>

            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Location</th>
                        <th>Status</th>
                        <th>Update</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Garbage Near Park</td>
                        <td>Main Street</td>
                        <td class="status new">New</td>
                        <td>
                            <select>
                                <option>New</option>
                                <option>In Progress</option>
                                <option>Resolved</option>
                            </select>
                            <button class="save-btn">Save</button>
                        </td>
                    </tr>

                    <tr>
                        <td>Overflowing Drain</td>
                        <td>Lake Road</td>
                        <td class="status progress">In Progress</td>
                        <td>
                            <select>
                                <option>New</option>
                                <option selected>In Progress</option>
                                <option>Resolved</option>
                            </select>
                            <button class="save-btn">Save</button>
                        </td>
                    </tr>

                    <tr>
                        <td>Street Light Issue</td>
                        <td>Hill View</td>
                        <td class="status resolved">Resolved</td>
                        <td>
                            <select>
                                <option>New</option>
                                <option>In Progress</option>
                                <option selected>Resolved</option>
                            </select>
                            <button class="save-btn">Save</button>
                        </td>
                    </tr>

                </tbody>
            </table>

        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
